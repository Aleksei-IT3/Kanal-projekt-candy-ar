<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   user-scalable=no">

    <title>Candy AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Hiro-Marker -->
        <a-marker preset="hiro">

            <!-- Testobjekt -->
            <a-box
                position="0 0.5 0"
                rotation="0 0 0"
                color="#00AAFF">
            </a-box>

            <!-- Sensorwert -->
            <a-text
                value="CANDY AR\nTemperatur: 42.6 C\nDruck: 5.8 bar\nStatus: OK"
                position="-1 1.5 0"
                rotation="-90 0 0"
                color="white"
                width="3">
            </a-text>

        </a-marker>

        <!-- Smartphone-Kamera -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
